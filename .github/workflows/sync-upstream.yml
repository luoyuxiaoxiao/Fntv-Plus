name: Sync Upstream

# 手动把 YDMY007/Fntv-Plus 的 release 合并到本 fork main（merge 而非 reset，
# fork 自有文件如 arch-package.yml 不会被上游覆盖丢失）。
# 上游默认分支是 release（main 在上游不存在），故跟踪 release。
# 2026-09-23 起取消定时同步（上游更新快、每次合都要修），改手动触发。
# 同步冲突时 job 失败并保留现场，需人工手动 merge 后 push。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Merge upstream release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Merge upstream release
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/YDMY007/Fntv-Plus.git 2>/dev/null || true
          # 同名 tag 指向分叉时普通 fetch 会整批失败（! rejected would clobber）；
          # 用 + 强制按上游为准更新（上游是版本真相源）。
          git fetch upstream '+refs/tags/*:refs/tags/*' '+refs/heads/release:refs/remotes/upstream/release'
          git checkout main
          # merge commit 需要身份；checkout 不自带，需显式设置，否则非快进合并直接失败。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 快进则快进，否则 merge（保留 fork 自有改动）；冲突即失败，人工处理。
          git merge --no-edit upstream/release || {
            echo "CONFLICT: upstream 与 fork 改动冲突，需人工手动 merge 后 push。"
            git status --short
            exit 1
          }
          git push origin main
          # fork 自建的同名 tag（如 v3.7.0）与上游同名 tag 指向不同提交时，
          # 按上游为准强制同步（上游是版本真相源；如需保留 fork tag 请先改名）。
          # 注意：先删本地已抓取的上游 tags 再重新抓，保证 push 的 refs 是最新的，
          # 否则 stale info 导致 rejected（fetch 与 push 之间上游 tag 又被改写）。
          git tag -l | xargs -r git tag -d >/dev/null
          git fetch upstream '+refs/tags/*:refs/tags/*' '+refs/heads/release:refs/remotes/upstream/release'
          git push origin --tags --force
